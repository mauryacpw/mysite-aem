<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
    data-sly-call="${clientlib.all @ categories='mysite.components.carousel'}" />
<sly data-sly-use.model="com.mysite.core.models.CarouselV2Model">
    <div data-sly-test="${!model.carouselItems}" class="cq-placeholder" data-emptytext="Carousel V2 Component"></div>

    <div data-sly-test="${model.carouselItems}" id="myCarousel-${resource.name}"
        class="cmp-custom-carousel cmp-carousel-v2 ${properties['cq:styleClasses']}">

        <div class="cmp-custom-carousel__inner">
            <div data-sly-repeat.item="${model.carouselItems}" class="cmp-custom-carousel__item">

                <div class="cmp-custom-carousel__media">
                    <sly data-sly-test="${item.mediaType == 'video' && item.videoPath}">
                        <video autoplay loop muted playsinline>
                            <source src="${item.videoPath}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </sly>
                    <sly data-sly-test="${item.mediaType != 'video' && item.imagePath}">
                        <img src="${item.imagePath}" alt="${item.title}">
                    </sly>
                    <sly data-sly-test="${item.mediaType != 'video' && !item.imagePath}">
                        <svg class="bd-placeholder-img" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true" preserveAspectRatio="xMidYMid slice" focusable="false">
                            <rect width="100%" height="100%" fill="#777"></rect>
                        </svg>
                    </sly>
                </div>
                <div class="cmp-custom-carousel__container">
                    <h1 data-sly-test="${item.title}">${item.title}</h1>
                    <p data-sly-test="${item.buttonText && item.buttonLink}">
                        <a class="cmp-custom-carousel__btn" href="${item.buttonLink}.html">${item.buttonText}</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="cmp-custom-carousel__indicators">
            <button data-sly-repeat.item="${model.carouselItems}"
                class="cmp-custom-carousel__indicator ${itemList.first ? 'cmp-custom-carousel__indicator--active' : ''}"
                aria-label="Slide ${itemList.count}"></button>
        </div>

        <button class="cmp-custom-carousel__control cmp-custom-carousel__control--prev"
            aria-label="Previous">&#10094;</button>
        <button class="cmp-custom-carousel__control cmp-custom-carousel__control--next"
            aria-label="Next">&#10095;</button>
    </div>
</sly>
